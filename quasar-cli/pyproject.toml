[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-ai"
version = "2.0.0"
description = "🚀 QUASAR - AI-powered CLI code editor with agentic capabilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Sunil Kumawat"}
]
keywords = ["ai", "cli", "code-editor", "llm", "agent", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # LangChain
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-groq>=0.0.1",
    "langchain-ollama>=0.0.1",
    # HTTP & WebSocket
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    # Web Search & Content Tools
    "tavily-python>=0.3.0",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.0",
    "duckduckgo-search>=4.0.0",
    "ddgs>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.scripts]
quasar = "backend.cli:app"

[project.urls]
Documentation = "https://sunilk240.github.io/quasar-cli/"
Repository = "https://github.com/Sunilk240/QUASAR/tree/main/quasar-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["tests*", "frontend*"]

[tool.setuptools.package-data]
backend = ["*.json", "*.yaml", "*.md"]

[tool.setuptools.exclude-package-data]
"*" = [".env", ".env.*", "*.log", "__pycache__", "*.pyc", "logs/*", "venv/*", ".venv/*"]
